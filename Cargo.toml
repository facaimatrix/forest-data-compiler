[workspace]
members = [
    "crates/compile-core",
    "apps/compiler/src-tauri",
]
resolver = "2"

[workspace.dependencies]
polars = { version = "0.46", features = [
    "lazy",
    "parquet",
    "csv",
    "strings",
    "dtype-categorical",
    "fmt",
    "concat_str",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
calamine = "0.26"
rust_xlsxwriter = "0.79"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
